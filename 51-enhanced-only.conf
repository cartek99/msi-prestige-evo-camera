# Enhanced-only camera (PLAN M2). Apps see ONE camera: the libcamera-loopback relay,
# "Built-in Camera (Enhanced)" (/dev/video0, GPU denoise). The raw libcamera node is hidden,
# so Snapshot also goes through the relay (one sensor owner, suspend handled by the relay).
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by `sudo bash cam-enhance.sh v64|v64x2`;
# `cam-enhance.sh raw` swaps back to 51-hide-relay-loopback.conf (native camera in Snapshot).
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "libcamera_input.__SB_.LNK0" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
