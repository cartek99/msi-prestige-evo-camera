# Hide the v4l2loopback "Intel MIPI Camera" (Teams/Zoom relay) from PipeWire apps.
# Without this, GNOME Snapshot can pick the loopback -> v4l2-relayd grabs the sensor with the
# SYSTEM tuning and blocks the native libcamera camera (cam-tune live mode shows nothing).
# Chrome/Teams/Zoom open /dev/video0 directly via V4L2, so they are unaffected.
# Added 2026-11-09 by ~/ipu7-cam-fix (cam-tune). Remove this file to undo.
monitor.v4l2.rules = [
  {
    matches = [ { node.name = "v4l2_input._sys_devices_virtual_video4linux_video0" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
