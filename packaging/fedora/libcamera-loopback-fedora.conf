# Fedora: v4l2-relayd (RPM Fusion) feeds the same loopback device.
# Starting either relay stops the other, so switching back is one command.
# NOTE: v4l2-relayd's generator re-creates v4l2-relayd@<name> for every
# /etc/v4l2-relayd.d/*.conf on each boot, pulled in by v4l2-relayd.service, so
# "systemctl disable v4l2-relayd@libcamerasrc" does not stick. Disable the stub
# instead: systemctl disable v4l2-relayd.service (rollback: enable it again).
[Unit]
Conflicts=v4l2-relayd@default.service v4l2-relayd@libcamerasrc.service
# After a kernel update, akmods builds v4l2loopback during boot, after
# systemd-modules-load has already run. Upstream's ConditionPathExists then
# skips the relay silently for that boot. Wait for akmods, load the module
# ourselves, and fail visibly (Restart=always retries) if it is still missing.
After=akmods.service
ConditionPathExists=

[Service]
ExecStartPre=/usr/sbin/modprobe v4l2loopback
# Root system services get no $HOME; give Mesa (GPU debayer) a shader cache.
Environment=MESA_SHADER_CACHE_DIR=/var/cache/libcamera-loopback/mesa
