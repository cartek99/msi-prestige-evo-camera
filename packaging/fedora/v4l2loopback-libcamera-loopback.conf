# Installed by the libcamera-loopback Fedora package.
# Named to sort after v4l2-relayd.conf, so these values win where both set
# the same option.
#
# exclusive_caps=1: the device advertises CAPTURE only while a writer is active
# (needed by Chrome). max_buffers=3: v4l2loopback grants every reader the
# writer's buffer count, and apps that set up fewer buffers crash with more.
options v4l2loopback devices=1 exclusive_caps=1 card_label="Built-in Camera (Enhanced)" max_buffers=3
